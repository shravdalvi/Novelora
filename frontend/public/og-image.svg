<!-- OG Image for Novelora - Bordeaux & Bone palette -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#D8D0C2"/>
  
  <!-- Subtle halftone dots -->
  <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="10" cy="10" r="1.5" fill="#1A1A1A" opacity="0.06"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots)"/>
  
  <!-- Logo box shadow -->
  <rect x="106" y="106" width="364" height="90" fill="#1A1A1A"/>
  <!-- Logo box in Bordeaux -->
  <rect x="100" y="100" width="364" height="90" fill="#4A1A23" stroke="#1A1A1A" stroke-width="4"/>
  <!-- Logo text in Bone -->
  <text x="135" y="168" font-family="Bangers, cursive, sans-serif" font-size="64" fill="#D8D0C2" letter-spacing="3">NOVELORA</text>
  
  <!-- Tagline in Ink -->
  <text x="100" y="235" font-family="Space Grotesk, sans-serif" font-size="28" font-weight="600" fill="#1A1A1A">Stories, panel by panel.</text>
  
  <!-- Big headline -->
  <text x="100" y="340" font-family="Bangers, cursive, sans-serif" font-size="96" fill="#1A1A1A" letter-spacing="2">WELCOME TO</text>
  <text x="100" y="440" font-family="Bangers, cursive, sans-serif" font-size="96" fill="#233126" letter-spacing="2">NOVELORA.</text>
  
  <!-- Right decorative panel -->
  <rect x="806" y="96" width="300" height="438" fill="#EDE8DF" stroke="#1A1A1A" stroke-width="4"/>
  <rect x="826" y="116" width="140" height="190" fill="#6A7657" stroke="#1A1A1A" stroke-width="3" transform="rotate(-5, 826, 116)"/>
  <rect x="926" y="136" width="140" height="190" fill="#8C603E" stroke="#1A1A1A" stroke-width="3" transform="rotate(3, 926, 136)"/>
  <rect x="876" y="126" width="140" height="190" fill="#4A1A23" stroke="#1A1A1A" stroke-width="3"/>
  
  <!-- Outer border -->
  <rect x="6" y="6" width="1188" height="618" fill="none" stroke="#1A1A1A" stroke-width="6"/>
</svg>
