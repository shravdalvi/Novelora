<!-- OG Image placeholder - replace with actual image in production -->
<!-- This is a 1200x630 SVG suitable for social sharing -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#FFFFFF"/>
  
  <!-- Halftone dots (subtle) -->
  <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="10" cy="10" r="1" fill="#8EC9F5" opacity="0.08"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots)"/>
  
  <!-- Logo box (shadow) -->
  <rect x="104" y="104" width="404" height="94" fill="#0B1D33"/>
  <!-- Logo box -->
  <rect x="100" y="100" width="404" height="94" fill="#8EC9F5" stroke="#0B1D33" stroke-width="3"/>
  <!-- Logo text -->
  <text x="130" y="170" font-family="Bangers, sans-serif" font-size="64" fill="#0B1D33" letter-spacing="2">NOVELORA</text>
  
  <!-- Tagline (shadow) -->
  <text x="102" y="232" font-family="Space Grotesk, sans-serif" font-size="28" fill="#0B1D33" opacity="0.3">Stories, panel by panel.</text>
  <text x="100" y="230" font-family="Space Grotesk, sans-serif" font-size="28" fill="#4A5B70">Stories, panel by panel.</text>
  
  <!-- Big headline -->
  <text x="100" y="340" font-family="Bangers, sans-serif" font-size="96" fill="#0B1D33" letter-spacing="2">WELCOME TO</text>
  <text x="100" y="440" font-family="Bangers, sans-serif" font-size="96" fill="#0B1D33" letter-spacing="2">NOVELORA.</text>
  
  <!-- Right side decorative comic panel -->
  <rect x="806" y="96" width="300" height="438" fill="#F2F8FD" stroke="#0B1D33" stroke-width="3"/>
  <rect x="812" y="102" width="300" height="438" fill="none" stroke="#0B1D33" stroke-width="1" opacity="0.3"/>
  
  <!-- Book covers (stylized) -->
  <rect x="826" y="116" width="140" height="190" fill="#7EE3C9" stroke="#0B1D33" stroke-width="3" transform="rotate(-5, 826, 116)"/>
  <rect x="926" y="136" width="140" height="190" fill="#B9A7F5" stroke="#0B1D33" stroke-width="3" transform="rotate(3, 926, 136)"/>
  <rect x="876" y="126" width="140" height="190" fill="#8EC9F5" stroke="#0B1D33" stroke-width="3"/>
  
  <!-- Border around entire image -->
  <rect x="6" y="6" width="1188" height="618" fill="none" stroke="#0B1D33" stroke-width="6"/>
</svg>
